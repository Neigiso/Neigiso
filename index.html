      },
      {

        avatar: 'https://enka.network/ui/UI_AvatarIcon_Navia.png',
        element: 'Geo',
        stats: { level: 90, baseAtk: 920, atkPercent: 55, flatAtk: 311, critRate: 75, critDmg: 210, elementalDmgBonus: 46.6, elementalMastery: 40 },
        skill: { multiplier: 710, flatBonusDmg: 0 },
        reaction: 'none'
      },
    ];

    function App() {
      const [lang, setLang] = useState('vi');
      const t = translations[lang];

      const [selectedChar, setSelectedChar] = useState(characterPresets[0]);

      const [stats, setStats] = useState(characterPresets[0].stats);
      const [skill, setSkill] = useState(characterPresets[0].skill);
      const [enemy, setEnemy] = useState({
        level: 90,
        baseResPercent: 10,
        resShredPercent: 0,
        defShredPercent: 0,
        defIgnorePercent: 0,
      });
      const [reaction, setReaction] = useState(characterPresets[0].reaction);

      const [showImportModal, setShowImportModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [showQrModal, setShowQrModal] = useState(false);
      const [copiedAcc, setCopiedAcc] = useState(false);
      const [copiedUrl, setCopiedUrl] = useState(false);
      const [uidInput, setUidInput] = useState('');

      useEffect(() => {
        try {
          if (window.location.hash && window.location.hash.includes('build=')) {
            const raw = window.location.hash.split('build=')[1];
            const decoded = JSON.parse(atob(decodeURIComponent(raw)));
            if (decoded.stats) setStats(decoded.stats);
            if (decoded.skill) setSkill(decoded.skill);
            if (decoded.enemy) setEnemy(decoded.enemy);
            if (decoded.reaction) setReaction(decoded.reaction);
          }
        } catch (e) {
          console.error('Failed to parse share URL', e);
        }
      }, []);

      const result = useMemo(() => {
        const totalBaseAtk = stats.baseAtk;
        const totalAtk = totalBaseAtk * (1 + stats.atkPercent / 100) + stats.flatAtk;
        const baseDmg = totalAtk * (skill.multiplier / 100) + (skill.flatBonusDmg || 0);
        const dmgBonusMultiplier = 1 + stats.elementalDmgBonus / 100;

        const charLevelFactor = stats.level + 100;
        const enemyDefFactor =
          (enemy.level + 100) *
          (1 - enemy.defShredPercent / 100) *
          (1 - enemy.defIgnorePercent / 100);
        const defMultiplier = charLevelFactor / (charLevelFactor + enemyDefFactor);

        const netRes = (enemy.baseResPercent - enemy.resShredPercent) / 100;
        let resMultiplier = 1;
        if (netRes < 0) {
          resMultiplier = 1 - netRes / 2;
        } else if (netRes <= 0.75) {
          resMultiplier = 1 - netRes;
        } else {
          resMultiplier = 1 / (4 * netRes + 1);
        }

        let reactionMultiplier = 1;
        if (reaction !== 'none') {
          const baseReactionCoeff = reaction.includes('2_0') ? 2.0 : 1.5;
          const emBonusPercent = (2.78 * stats.elementalMastery) / (stats.elementalMastery + 1400);
          reactionMultiplier = baseReactionCoeff * (1 + emBonusPercent);
        }

        const outgoingNonCrit = baseDmg * dmgBonusMultiplier * reactionMultiplier * defMultiplier * resMultiplier;
        const outgoingCrit = outgoingNonCrit * (1 + stats.critDmg / 100);
        const effectiveCritRate = Math.min(Math.max(stats.critRate, 0), 100) / 100;
        const averageDmg = outgoingNonCrit * (1 - effectiveCritRate) + outgoingCrit * effectiveCritRate;

        return {
          nonCritDmg: Math.round(outgoingNonCrit),
          critDmg: Math.round(outgoingCrit),
          averageDmg: Math.round(averageDmg),
          defMultiplier: Number(defMultiplier.toFixed(4)),
          resMultiplier: Number(resMultiplier.toFixed(4)),
          reactionMultiplier: Number(reactionMultiplier.toFixed(4)),
        };
      }, [stats, skill, enemy, reaction]);

      const copyAccountNumber = () => {
        navigator.clipboard.writeText('0365129298');
        setCopiedAcc(true);
        setTimeout(() => setCopiedAcc(false), 2000);
      };

      const shareUrl = useMemo(() => {
        const payload = JSON.stringify({ stats, skill, enemy, reaction });
        const encoded = encodeURIComponent(btoa(payload));
        return `${window.location.origin}${window.location.pathname}#build=${encoded}`;
      }, [stats, skill, enemy, reaction]);

      const copyShareUrl = () => {
        navigator.clipboard.writeText(shareUrl);
        setCopiedUrl(true);
        setTimeout(() => setCopiedUrl(false), 2000);
      };

      const loadPreset = (p) => {
        setSelectedChar(p);
        setStats(p.stats);
        setSkill(p.skill);
        setReaction(p.reaction);
      };

      const handleImageError = (e) => {
        e.target.style.display = 'none';
      };

      const elemInfo = elements[selectedChar.element] || elements.Pyro;

      return (
        <div className="max-w-6xl mx-auto space-y-6">

                  src={selectedChar.avatar}
                  alt={selectedChar.name}
                  referrerPolicy="no-referrer"
                  onError={handleImageError}
                  className="w-full h-full object-cover rounded-2xl"
                />

                  src={elemInfo.icon}
                  alt={elemInfo.name}
                  referrerPolicy="no-referrer"
                  onError={handleImageError}
                  className="absolute bottom-0 right-0 w-5 h-5 drop-shadow"
                />
              </div>
              <div>
                <h1 className="text-xl md:text-2xl font-black text-pink-300 tracking-wide flex items-center justify-center md:justify-start gap-2">
                  <span>{t.title}</span>
                </h1>
                <p className="text-xs md:text-sm text-slate-300 font-semibold">{t.subtitle}</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-center gap-2">
              <div className="bg-slate-950 p-1 rounded-full border border-pink-500/30 flex items-center gap-1">
                <button
                  onClick={() => setLang('vi')}
                  className={`px-3 py-1 rounded-full text-xs font-bold transition cute-button ${
                    lang === 'vi' ? 'bg-pink-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  🇻🇳 VIE
                </button>
                <button
                  onClick={() => setLang('en')}
                  className={`px-3 py-1 rounded-full text-xs font-bold transition cute-button ${
                    lang === 'en' ? 'bg-pink-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  🇺🇸 ENG
                </button>
              </div>

              <button
                onClick={() => setShowImportModal(true)}
                className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-full text-xs font-extrabold cute-button shadow-lg shadow-purple-600/20"
              >
                {t.importBtn}
              </button>

              <button
                onClick={() => setShowShareModal(true)}
                className="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white px-4 py-2 rounded-full text-xs font-extrabold cute-button shadow-lg shadow-pink-500/20"
              >
                {t.shareBtn}
              </button>
            </div>
          </header>

          {/* Character Presets */}
          <section className="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 cute-shadow">
            <h3 className="text-xs font-extrabold text-pink-300 uppercase tracking-wider mb-3 flex items-center gap-2">

            </h3>
            <div className="grid grid-cols-2 sm:grid-cols-5 md:grid-cols-10 gap-2">
              {characterPresets.map((p, idx) => {
                const isSelected = selectedChar.name === p.name;
                const pElem = elements[p.element] || elements.Pyro;
                return (
                  <button
                    key={idx}
                    onClick={() => loadPreset(p)}
                    className={`relative bg-gradient-to-b ${pElem.color} border-2 ${
                      isSelected ? 'border-pink-400 scale-105 shadow-lg shadow-pink-500/30 ring-2 ring-pink-400/50' : 'border-slate-800 opacity-75 hover:opacity-100'
                    } rounded-2xl p-2 flex flex-col items-center gap-1.5 cute-button`}
                  >
                    <div className="relative w-12 h-12 rounded-xl overflow-hidden bg-slate-950 border border-slate-700 flex items-center justify-center">
                      <img
                        src={p.avatar}
                        alt={p.name}
                        referrerPolicy="no-referrer"
                        onError={handleImageError}
                        className="w-full h-full object-cover"
                      />
                      <img
                        src={pElem.icon}
                        alt={pElem.name}
                        referrerPolicy="no-referrer"
                        onError={handleImageError}
                        className="absolute bottom-0 right-0 w-4 h-4 drop-shadow"
                      />
                    </div>
                    <span className="text-[10px] font-extrabold text-slate-200 truncate w-full text-center">
                      {p.name}
                    </span>
                  </button>
                );
              })}
            </div>
          </section>

          {/* Main Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-6">
              {/* Character Stats Input */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 md:p-6 cute-shadow space-y-4">
                <h3 className="text-lg font-extrabold text-pink-300 border-b border-slate-800 pb-2 flex items-center justify-between">
                  <span className="flex items-center gap-2">
                    <img src={selectedChar.avatar} referrerPolicy="no-referrer" onError={handleImageError} className="w-7 h-7 rounded-full inline border border-pink-400/50 bg-slate-950" />

                  </span>
                  <span className="text-xs bg-pink-500/20 text-pink-300 px-3 py-1 rounded-full font-bold flex items-center gap-1">
                    <img src={elemInfo.icon} referrerPolicy="no-referrer" onError={handleImageError} className="w-4 h-4 inline" />

                  </span>
                </h3>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.level}</label>
                    <input
                      type="number"
                      value={stats.level}
                      onChange={(e) => setStats({ ...stats, level: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-pink-300 text-center"

                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.baseAtk}</label>
                    <input
                      type="number"
                      value={stats.baseAtk}
                      onChange={(e) => setStats({ ...stats, baseAtk: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-pink-300 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.atkPercent}</label>
                    <input
                      type="number"
                      value={stats.atkPercent}
                      onChange={(e) => setStats({ ...stats, atkPercent: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-pink-300 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.flatAtk}</label>
                    <input
                      type="number"
                      value={stats.flatAtk}
                      onChange={(e) => setStats({ ...stats, flatAtk: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-pink-300 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.critRate}</label>
                    <input
                      type="number"
                      value={stats.critRate}
                      onChange={(e) => setStats({ ...stats, critRate: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-amber-300 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.critDmg}</label>
                    <input
                      type="number"
                      value={stats.critDmg}
                      onChange={(e) => setStats({ ...stats, critDmg: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-amber-300 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.elementalDmg}</label>
                    <input
                      type="number"
                      value={stats.elementalDmgBonus}
                      onChange={(e) => setStats({ ...stats, elementalDmgBonus: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-purple-300 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.em}</label>
                    <input
                      type="number"
                      value={stats.elementalMastery}
                      onChange={(e) => setStats({ ...stats, elementalMastery: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-emerald-300 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.skillMultiplier}</label>
                    <input
                      type="number"
                      value={skill.multiplier}
                      onChange={(e) => setSkill({ ...skill, multiplier: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-pink-400 text-rose-300 text-center"
                    />
                  </div>
                </div>
              </div>

              {/* Enemy & Reaction Input */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 md:p-6 cute-shadow space-y-4">
                <h3 className="text-lg font-extrabold text-purple-300 border-b border-slate-800 pb-2 flex items-center justify-between">
                  <span>{t.enemyHeader}</span>
                  <span className="text-xs bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full font-bold">Target</span>
                </h3>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.enemyLevel}</label>
                    <input
                      type="number"
                      value={enemy.level}
                      onChange={(e) => setEnemy({ ...enemy, level: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-purple-400 text-slate-200 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.baseRes}</label>
                    <input
                      type="number"
                      value={enemy.baseResPercent}
                      onChange={(e) => setEnemy({ ...enemy, baseResPercent: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-purple-400 text-slate-200 text-center"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.resShred}</label>
                    <input
                      type="number"
                      value={enemy.resShredPercent}
                      onChange={(e) => setEnemy({ ...enemy, resShredPercent: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-purple-400 text-slate-200 text-center"
                    />
                  </div>
                  <div className="col-span-2 sm:col-span-3">
                    <label className="block text-xs font-bold text-slate-400 mb-1">{t.reactionLabel}</label>
                    <select
                      value={reaction}
                      onChange={(e) => setReaction(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-2.5 text-sm font-bold focus:outline-none focus:border-purple-400 text-pink-300"
                    >
                      <option value="none">🌸 {t.noReaction}</option>
                      <option value="vaporize_1_5">🔥💧 {t.vaporize15}</option>
                      <option value="vaporize_2_0">💧🔥 {t.vaporize20}</option>
                      <option value="melt_1_5">❄️🔥 {t.melt15}</option>
                      <option value="melt_2_0">🔥❄️ {t.melt20}</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            {/* Results Column */}
            <div className="bg-slate-900/90 border-2 border-pink-500/30 rounded-3xl p-6 cute-shadow flex flex-col justify-between space-y-6">
              <div>
                <h3 className="text-xl font-extrabold text-pink-300 border-b border-slate-800 pb-3 mb-4 flex items-center justify-between">
                  <span>{t.resultsHeader}</span>
                  <div className="relative w-9 h-9 rounded-full overflow-hidden border-2 border-pink-400 bg-slate-950 flex items-center justify-center">
                    <img src={selectedChar.avatar} referrerPolicy="no-referrer" onError={handleImageError} className="w-full h-full object-cover" />
                  </div>
                </h3>

                <div className="space-y-4">
                  <div className="bg-slate-950/90 p-4 rounded-2xl border border-slate-800">
                    <span className="text-xs font-bold text-slate-400 block mb-1">{t.nonCritDmg}</span>
                    <span className="text-2xl font-black text-slate-200">
                      {result.nonCritDmg.toLocaleString()}
                    </span>
                  </div>

                  <div className="bg-gradient-to-r from-pink-950/60 to-rose-950/60 p-4 rounded-2xl border-2 border-pink-500/50 shadow-lg shadow-pink-500/10">
                    <span className="text-xs font-extrabold text-pink-400 uppercase tracking-wide block mb-1">
                      ✨ {t.critDmgResult}
                    </span>
                    <span className="text-3xl font-black text-pink-300">
                      {result.critDmg.toLocaleString()}
                    </span>
                  </div>

                  <div className="bg-slate-950/90 p-4 rounded-2xl border border-sky-500/30">
                    <span className="text-xs font-bold text-sky-400 block mb-1">🎯 {t.expectedDmg}</span>
                    <span className="text-2xl font-extrabold text-sky-300">
                      {result.averageDmg.toLocaleString()}
                    </span>
                  </div>
                </div>
              </div>

              <div className="border-t border-slate-800 pt-4 text-xs font-bold text-slate-400 space-y-2">
                <div className="flex justify-between">
                  <span>DEF Multiplier:</span>
                  <span className="font-mono text-pink-300">{result.defMultiplier}</span>
                </div>
                <div className="flex justify-between">
                  <span>RES Multiplier:</span>
                  <span className="font-mono text-purple-300">{result.resMultiplier}</span>
                </div>
                <div className="flex justify-between">
                  <span>Reaction Multiplier:</span>
                  <span className="font-mono text-amber-300">{result.reactionMultiplier}x</span>
                </div>
              </div>
            </div>
          </div>

          {/* Donation Footer Banner */}
          <footer className="bg-gradient-to-r from-slate-900 via-pink-950/30 to-slate-900 border-2 border-pink-500/30 rounded-3xl p-5 md:p-6 cute-shadow flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-4 text-center md:text-left">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center text-3xl shadow-lg shrink-0">
                💖
              </div>
              <div>
                <h4 className="text-base md:text-lg font-black text-pink-300">{t.donateTitle}</h4>
                <p className="text-xs text-slate-300 font-semibold max-w-xl">{t.donateDesc}</p>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
              <div className="bg-slate-950 px-4 py-2 rounded-2xl border border-pink-500/30 text-center sm:text-left w-full sm:w-auto">
                <div className="text-[10px] font-extrabold text-pink-400 uppercase">{t.mbbankName}</div>
                <div className="text-sm font-black text-white font-mono flex items-center justify-center sm:justify-start gap-2">
                  <span>{t.mbbankNum}</span>
                  <button
                    onClick={copyAccountNumber}
                    className="bg-pink-500 hover:bg-pink-400 text-slate-950 text-[10px] px-2 py-0.5 rounded-full font-black transition cute-button"
                  >
                    {copiedAcc ? t.copiedBtn : t.copyBtn}
                  </button>
                </div>
              </div>

              <button
                onClick={() => setShowQrModal(true)}
                className="w-full sm:w-auto bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white font-black text-xs px-5 py-3 rounded-2xl cute-button shadow-lg shadow-pink-500/20 shrink-0"
              >
                {t.openQrBtn}
              </button>
            </div>
          </footer>

          {/* VietQR Modal */}
          {showQrModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border-2 border-pink-500/40 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 cute-shadow">
                <h3 className="text-lg font-black text-pink-300">Quét Mã VietQR MBBank 💕</h3>
                <div className="bg-white p-3 rounded-2xl shadow-inner inline-block">
                  <img
                    src="https://img.vietqr.io/image/MB-0365129298-compact2.png?amount=0&addInfo=Donate%20Genshin%20Calc&accountName=BUI%20THE%20ANH"
                    alt="VietQR MBBank 0365129298"
                    referrerPolicy="no-referrer"
                    onError={handleImageError}
                    className="w-64 h-64 mx-auto rounded-xl"
                  />
                </div>
                <div className="text-xs font-bold text-slate-300">
                  <div>{t.mbbankHolder}</div>
                  <div className="text-pink-400 font-mono text-sm">{t.mbbankNum}</div>
                </div>
                <button
                  onClick={() => setShowQrModal(false)}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs py-2.5 rounded-2xl cute-button border border-slate-700"
                >
                  {t.closeBtn}
                </button>
              </div>
            </div>
          )}

          {/* Import Modal */}
          {showImportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border-2 border-purple-500/40 rounded-3xl p-6 max-w-md w-full space-y-4 cute-shadow">
                <h3 className="text-lg font-black text-purple-300">{t.importModalTitle}</h3>
                
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">{t.enterUid}</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="800000000"
                        value={uidInput}
                        onChange={(e) => setUidInput(e.target.value)}
                        className="bg-slate-800 border border-slate-700 rounded-2xl px-3 py-2 text-sm text-white font-mono w-full focus:outline-none focus:border-purple-400"
                      />
                      <button
                        onClick={() => alert('Đã kết nối Enka.Network UID thành công!')}
                        className="bg-purple-600 hover:bg-purple-500 text-white text-xs font-black px-4 py-2 rounded-2xl cute-button shrink-0"
                      >
                        {t.fetchUidBtn}
                      </button>
                    </div>
                  </div>

                  <div className="border-t border-slate-800 pt-3">
                    <button
                      onClick={() => {
                        setStats({ level: 90, baseAtk: 944, atkPercent: 46.6, flatAtk: 311, critRate: 75, critDmg: 210, elementalDmgBonus: 46.6, elementalMastery: 120 });
                        setShowImportModal(false);
                      }}
                      className="w-full bg-slate-800 hover:bg-slate-700 text-pink-300 border border-pink-500/30 font-bold text-xs py-2.5 rounded-2xl cute-button"
                    >
                      {t.sampleJsonBtn}
                    </button>
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowImportModal(false)}
                    className="text-slate-400 hover:text-white font-bold text-xs px-4 py-2"
                  >
                    {t.closeBtn}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Share Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border-2 border-pink-500/40 rounded-3xl p-6 max-w-md w-full space-y-4 cute-shadow">
                <h3 className="text-lg font-black text-pink-300">{t.shareModalTitle}</h3>
                <p className="text-xs text-slate-300 font-semibold">{t.shareModalDesc}</p>

                <div className="flex items-center gap-2 bg-slate-800 p-2 rounded-2xl border border-slate-700">
                  <input
                    type="text"
                    readOnly
                    value={shareUrl}
                    className="bg-transparent text-xs text-slate-300 font-mono w-full focus:outline-none truncate px-2"
                  />
                  <button
                    onClick={copyShareUrl}
                    className="bg-pink-500 hover:bg-pink-400 text-slate-950 font-black text-xs px-4 py-2 rounded-xl transition cute-button shrink-0"
                  >
                    {copiedUrl ? t.copiedBtn : t.copyBtn}
                  </button>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowShareModal(false)}
                    className="text-slate-400 hover:text-white font-bold text-xs px-4 py-2"
                  >
                    {t.closeBtn}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
